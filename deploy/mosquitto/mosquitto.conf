# ============================================================
# Mosquitto 2.x 配置 —— CDCIM 设备接入侧
# 依据：docs/03-架构/01-组件映射表-v1.md §1.2（1883/9001、QoS1、最大连接 200、单条 ≤ 4 KB）
#      docs/03-架构/07-物理视图.md §4（Mosquitto 是唯一双归属节点，断网注入点）
#
# 挂载方式：./mosquitto:/mosquitto/config:ro（整目录只读）
#   目录内需有：mosquitto.conf（本文件）、passwd（口令文件，不纳管）
#   passwd 由 `make init-mqtt` 调 mosquitto_passwd 生成，格式为
#   <user>:$7$101$<salt>$<hash>（PBKDF2-SHA512），无法在仓库内预置。
# ============================================================

# ---------- 监听 ----------
# 单监听器口径：per_listener_settings false 表示全局一套认证参数，
# 与「设备侧只有一个入口」一致；若将来为 Websocket 单独设 ACL，
# 需改为 true 并为每个 listener 重复配置认证项。
per_listener_settings false

# 0.0.0.0 是容器内地址，宿主侧仍由 compose 绑 127.0.0.1（物理视图 §3 说明 1）。
# 写 0.0.0.0 而非 127.0.0.1，是为了让同一 edge-net 内的 collector 容器可达。
listener 1883 0.0.0.0

# Websocket 监听：给浏览器端与调试工具用（前端大屏不直连 MQTT，
# 保留它只为现场排障；生产若不用可整段注释掉）
listener 9001 0.0.0.0
protocol websockets

# ---------- 认证 ----------
# 关闭匿名：设备鉴权是等保「身份鉴别」项，也是 1883 端口虽绑回环仍须认证的理由
allow_anonymous false

# 口令文件：路径以容器内为准；宿主文件为 deploy/mosquitto/passwd
# 文件缺失时 mosquitto 启动即退出（错误日志 "Error: Unable to open password file"），
# 这是刻意的 fail-closed——宁可起不来，不要无认证地起来
password_file /mosquitto/config/passwd

# 接真实设备时追加的两项（本期原型未启用，故注释保留）：
#   acl_file /mosquitto/config/acl
#     限制单设备只能发布自己的 telemetry/<device_code>/...，禁止订阅他人主题
#   tls 相关（cafile/certfile/keyfile、tls_version 1.2）
#     等保「传输加密」要求；原型在单机内网，链路不出宿主，P6 前补齐

# ---------- 会话与消息 ----------
# 持久化：QoS1 的 PUBACK 必须在落盘后返回，否则「broker 应答了但断电丢了」，
# 客户端会删掉本地副本——这是数据丢失最隐蔽的形态
persistence true
persistence_location /mosquitto/data/
# 落盘周期：60 s 一次全量快照；两次快照之间靠 WAL 式的追加写兜底
autosave_interval 60

# 队列上限：单客户端离线期间的待投消息数。
# 1000 条 × 4 KB ≈ 4 MB，200 连接最坏 800 MB —— 与 64 MB 容器上限冲突，
# 但真正会排队的只有「刚断线的少数客户端」，故取 1000 并在超限时丢弃最旧（默认行为）。
# 断网期间的数据完整性由边端环形队列负责，不依赖 broker 保序（边云协同 §7.1）
max_queued_messages 1000

# 单条报文 4 KB：与消息契约 §6「单条消息上限 4 KB」一致。
# 超限报文被 broker 直接断开连接，而不是静默截断——静默截断会让下游收到坏 JSON
message_size_limit 4096

# 最大连接数 200：组件映射表 §1.2 的取值；超出时新连接被拒（不排队）
max_connections 200

# 单客户端在途消息（QoS1/2 未确认）上限；20 兼顾吞吐与内存
max_inflight_messages 20

# 持久会话回收：本项目「持久会话关闭，重连由客户端补采」（组件映射表 §1.2）。
# 客户端应使用 clean_session=true；此参数兜底清理忘记断开的会话，
# 1 h 无活动即逐出，避免 64 MB 内存被僵尸会话占满
persistent_client_expiration 1h

# Keepalive 上限：设备侧 5 s 采样，心跳 60 s 足够；>120 s 视为链路异常
max_keepalive 120

# ---------- 日志 ----------
# 输出到 stdout：交给 Docker json-file 驱动轮转（10 MB × 3），
# 容器内不写文件，避免卷里长出一个无人管理的日志文件
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z

# 系统主题间隔：$SYS/broker/uptime 等每 10 s 刷新，
# 供 Prometheus 的 mosquitto_exporter 与健康检查复用
sys_interval 10

# 自动升级 QoS：关闭。发布侧已显式指定 QoS1，
# 自动升级会让 QoS0 的调试消息变成持久消息，白占队列
upgrade_outgoing_qos false
