# ============================================================
# CDCIM 单机编排文件（Compose v2）
# 依据：docs/03-架构/07-物理视图.md（TAB-ARCH-121 容器/端口/卷/内存、FIG-ARCH-19 网络分区）
#      docs/03-架构/01-组件映射表-v1.md（§3 端口规划、§4 内存预算）
#
# 三条不可动摇的规则：
#   1. 只有 nginx 的 ${PORT_WEB} 绑 0.0.0.0，其余端口全部绑 127.0.0.1（C-07 / SEC-C-02）
#   2. 三段 bridge 网络按信任级别切分，Mosquitto 是唯一双归属业务节点（断网注入点）
#   3. 每个容器显式声明 mem_limit 与 cpus，不依赖默认值（C-01 / ADR-0002）
#
# 镜像 tag 为「占位口径」：物理视图 §1 已声明 tag 由 P4 锁定后写入依赖清单。
# 本文件全部 tag 均可用 .env 的 *_IMAGE 覆盖，切换镜像加速源只改 .env 一处。
#
# 尚未在本机运行（未执行 docker compose up），首次启动验证见
# docs/05-实施/01-部署架构落地说明.md §7。
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-cdcim}

# ---------- 复用片段：日志轮转（物理视图 §7 约束 10 的配套） ----------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ---------- 复用片段：服务就绪探针的公共参数 ----------
x-health-defaults: &health-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ==========================================================
  # 1. 采集网关（边端，只挂 edge-net）
  #    内存 256 MB：含 150 MB 环形队列的文件页缓存（不计入 RSS）
  # ==========================================================
  collector:
    image: ${COLLECTOR_IMAGE:-cdcim/collector-gateway:0.1}
    build:
      context: ..
      dockerfile: core/collector/Dockerfile
    container_name: cdcim-collector
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.8
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 256M
    networks:
      - edge-net
    ports:
      # 健康检查与 /metrics，仅回环
      - "127.0.0.1:${PORT_COLLECTOR:-8001}:8001"
    volumes:
      # 断网期间唯一副本，不可重建（物理视图 TAB-ARCH-123 #3）
      - collector-queue:/var/lib/collector/queue
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_URL: mqtt://${MQTT_USER:-cdcim}:${MQTT_PASSWORD}@cdcim-mqtt:1883
      MQTT_TOPIC: ${MQTT_TOPIC_TELEMETRY:-telemetry/raw}
      QUEUE_MAX_BYTES: ${COLLECTOR_QUEUE_MAX_BYTES:-157286400}
      SAMPLE_FAST_S: ${SAMPLE_FAST_S:-5}
      SAMPLE_SLOW_S: ${SAMPLE_SLOW_S:-30}
      REPLAY_RATE_LIMIT: ${REPLAY_RATE_LIMIT:-1440}
      CDCIM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CDCIM_MQTT_HOST: cdcim-mqtt
      CDCIM_MQTT_PORT: 1883
      CDCIM_MQTT_USERNAME: ${MQTT_USER:-cdcim}
      CDCIM_MQTT_PASSWORD: ${MQTT_PASSWORD}
      CDCIM_MQTT_TOPIC_PATTERN: ${MQTT_TOPIC_PATTERN:-cdcim/+/+/telemetry}
      CDCIM_KAFKA_BOOTSTRAP_SERVERS: cdcim-broker:9092
      CDCIM_BUFFER_PATH: /var/lib/collector/queue/collector-buffer.db
      CDCIM_BUFFER_QUOTA_MB: ${COLLECTOR_BUFFER_QUOTA_MB:-150}
      CDCIM_BUFFER_REPLAY_RATE_PER_S: ${REPLAY_RATE_LIMIT:-1440}
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      # 镜像基座为 python:3.11-slim，无 curl/wget，改用标准库（PY-06 之外的健康探针例外）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
    logging: *default-logging

  # ==========================================================
  # 2. MQTT 接入（唯一双归属：edge-net + core-net）
  #    双归属即断网注入点：docker network disconnect cdcim-edge-net cdcim-mqtt
  # ==========================================================
  mqtt:
    image: ${MQTT_IMAGE:-eclipse-mosquitto:2.0}
    container_name: cdcim-mqtt
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    networks:
      - edge-net
      - core-net
    ports:
      - "127.0.0.1:${PORT_MQTT:-1883}:1883"
      - "127.0.0.1:${PORT_MQTT_WS:-9001}:9001"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 仅健康检查使用，broker 自身不读这两个变量（凭据来自 passwd 文件）
      MQTT_USER: ${MQTT_USER:-cdcim}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    healthcheck:
      <<: *health-defaults
      # 用发布而非订阅探测：QoS1 PUBACK 返回即说明 ACL 与持久化链路可用
      test: ["CMD-SHELL", 'mosquitto_pub -h 127.0.0.1 -p 1883 -u "$$MQTT_USER" -P "$$MQTT_PASSWORD" -t cdcim/healthcheck -m ok -q 1']
    logging: *default-logging

  # ==========================================================
  # 3. 事件总线（Redpanda 单节点，只挂 core-net）
  #    内存 1152 MB：Seastar 预占，不可压缩（组件映射表 §4 标注「否」）
  # ==========================================================
  broker:
    image: ${BROKER_IMAGE:-redpandadata/redpanda:v24.2.10}
    container_name: cdcim-broker
    restart: unless-stopped
    mem_limit: 1152m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1152M
    networks:
      - core-net
    ports:
      - "127.0.0.1:${PORT_KAFKA:-9092}:9092"
      - "127.0.0.1:${PORT_KAFKA_ADMIN:-9644}:9644"
      - "127.0.0.1:${PORT_KAFKA_PROXY:-8082}:8082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      # 单节点必须 dev-container 模式：否则 Redpanda 以生产默认值启动，
      # 会因副本数/内存预留校验直接退出（详见部署说明 §7 第 4 条）
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://cdcim-broker:9092
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      <<: *health-defaults
      interval: 10s
      start_period: 60s
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
    logging: *default-logging

  # ==========================================================
  # 4. 流计算（core-net 消费 + data-net 写库，跨区业务节点）
  # ==========================================================
  stream:
    image: ${STREAM_IMAGE:-cdcim/stream-compute:0.1}
    build:
      context: ..
      dockerfile: core/stream/Dockerfile
    container_name: cdcim-stream
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    networks:
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_STREAM:-8002}:8002"
    volumes:
      # 写失败的死信批次，≤ 1 GB 超限告警（物理视图 TAB-ARCH-123 #4）
      - dlq:/var/lib/deadletter
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP: cdcim-broker:9092
      CONSUMER_GROUP: ${CONSUMER_GROUP_COMPUTE:-cg-compute}
      TD_ENDPOINT: cdcim-tsdb:6041
      TD_USER: ${TDENGINE_USER:-root}
      TD_PASSWORD: ${TDENGINE_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cdcim-cache:6379/0
      WATERMARK_LAG_S: ${WATERMARK_LAG_S:-60}
      BATCH_SIZE: ${WRITE_BATCH_SIZE:-500}
      BATCH_INTERVAL_MS: ${WRITE_BATCH_INTERVAL_MS:-200}
      CDCIM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CDCIM_KAFKA_BOOTSTRAP_SERVERS: cdcim-broker:9092
      CDCIM_TDENGINE_HOST: cdcim-tsdb
      CDCIM_TDENGINE_REST_PORT: 6041
      CDCIM_TDENGINE_USER: ${TDENGINE_USER:-root}
      CDCIM_TDENGINE_PASSWORD: ${TDENGINE_PASSWORD}
      CDCIM_TDENGINE_DATABASE: dcim
      CDCIM_REDIS_URL: redis://:${REDIS_PASSWORD}@cdcim-cache:6379/0
      CDCIM_WINDOW_SIZE_S: ${WINDOW_SIZE_S:-60}
      CDCIM_WATERMARK_DELAY_S: ${WATERMARK_LAG_S:-60}
      CDCIM_WRITE_BATCH_MAX_ROWS: ${WRITE_BATCH_SIZE:-500}
      CDCIM_WRITE_BATCH_MAX_DELAY_MS: ${WRITE_BATCH_INTERVAL_MS:-200}
    depends_on:
      broker:
        condition: service_healthy
      tsdb:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      start_period: 45s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
    logging: *default-logging

  # ==========================================================
  # 5. 告警引擎（core-net 消费 + data-net 落库/抑制键）
  # ==========================================================
  alarm:
    image: ${ALARM_IMAGE:-cdcim/alarm-engine:0.1}
    # P4 无告警服务代码；不进默认启动集，P5 实现后移除该 profile
    profiles: ["p5"]
    container_name: cdcim-alarm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.6
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 256M
    networks:
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_ALARM:-8003}:8003"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP: cdcim-broker:9092
      CONSUMER_GROUP: ${CONSUMER_GROUP_ALARM:-cg-alarm}
      PG_DSN: postgresql://${PG_USER:-cdcim}:${PG_PASSWORD}@cdcim-pg:5432/${PG_DB:-cdcim}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cdcim-cache:6379/1
      SUPPRESS_WINDOW_S: ${SUPPRESS_WINDOW_S:-300}
      AI_TASK_ENABLED: ${AI_EXTERNAL_ENABLED:-false}
    depends_on:
      broker:
        condition: service_healthy
      pg:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=3)"]
    logging: *default-logging

  # ==========================================================
  # 6. 时序库（TDengine，只挂 data-net）
  #    4 库 4 超级表由 initdb/02-tdengine.sql 创建，首次启动预热较慢
  # ==========================================================
  tsdb:
    image: ${TSDB_IMAGE:-tdengine/tdengine:3.3.2.0}
    container_name: cdcim-tsdb
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 640M
    networks:
      - data-net
    ports:
      - "127.0.0.1:${PORT_TDENGINE:-6030}:6030"
      - "127.0.0.1:${PORT_TDENGINE_REST:-6041}:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TAOS_FIRST_EP: cdcim-tsdb:6030
    healthcheck:
      <<: *health-defaults
      # 首次启动需初始化数据目录，start_period 放宽到 90 s
      interval: 10s
      start_period: 90s
      retries: 10
      test: ["CMD-SHELL", "taos -h 127.0.0.1 -s 'SHOW DATABASES;' > /dev/null 2>&1"]
    logging: *default-logging

  # ==========================================================
  # 7. 关系库（PostgreSQL 16，只挂 data-net）
  #    initdb 只挂 01-postgres.sql 单个文件：整目录挂载会把 02-tdengine.sql 也喂给 PG
  # ==========================================================
  pg:
    image: ${PG_IMAGE:-postgres:16-alpine}
    container_name: cdcim-pg
    restart: unless-stopped
    mem_limit: 320m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 320M
    networks:
      - data-net
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb/01-postgres.sql:/docker-entrypoint-initdb.d/01-postgres.sql:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${PG_DB:-cdcim}
      POSTGRES_USER: ${PG_USER:-cdcim}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      # shared_buffers 64 MB：320 MB 上限下给连接与排序留余量（组件映射表 §4）
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    logging: *default-logging

  # ==========================================================
  # 8. 缓存（Redis 7，只挂 data-net）
  #    maxmemory 96 MB + allkeys-lru：抑制键可丢，键可由库重建
  # ==========================================================
  cache:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: cdcim-cache
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 160M
    networks:
      - data-net
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
    logging: *default-logging

  # ==========================================================
  # 9. 向量库（Qdrant，只挂 data-net）
  # ==========================================================
  vector:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
    container_name: cdcim-vector
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - data-net
    ports:
      - "127.0.0.1:${PORT_QDRANT:-6333}:6333"
      - "127.0.0.1:${PORT_QDRANT_GRPC:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      <<: *health-defaults
      # 镜像无 curl，用 bash 的 /dev/tcp 做端口连通探测
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
    logging: *default-logging

  # ==========================================================
  # 10. AI 代理（旁路，profile=ai，默认不启动）
  #     出站开关 AI_EXTERNAL_ENABLED 默认 false：不配 key 也能起，功能降级
  # ==========================================================
  ai:
    image: ${AI_IMAGE:-cdcim/ai-proxy:0.1}
    container_name: cdcim-ai
    profiles: ["ai"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.4
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 128M
    networks:
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_AI:-8004}:8004"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP: cdcim-broker:9092
      CONSUMER_GROUP: ${CONSUMER_GROUP_AI:-cg-ai}
      QDRANT_URL: http://cdcim-vector:6333
      PG_DSN: postgresql://${PG_USER:-cdcim}:${PG_PASSWORD}@cdcim-pg:5432/${PG_DB:-cdcim}
      AI_EXTERNAL_ENABLED: ${AI_EXTERNAL_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-10}
      LLM_CIRCUIT_FAILS: ${LLM_CIRCUIT_FAILS:-5}
      LLM_CIRCUIT_COOLDOWN_S: ${LLM_CIRCUIT_COOLDOWN_S:-600}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-20}
      MASK_SALT: ${MASK_SALT}
    depends_on:
      vector:
        condition: service_healthy
      pg:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/healthz', timeout=3)"]
    logging: *default-logging

  # ==========================================================
  # 11. API 服务（BFF，core-net + data-net）
  # ==========================================================
  api:
    image: ${API_IMAGE:-cdcim/api-service:0.1}
    build:
      context: ..
      dockerfile: core/api/Dockerfile
    container_name: cdcim-api
    restart: unless-stopped
    mem_limit: 224m
    cpus: 0.6
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 224M
    networks:
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_API:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PG_DSN: postgresql://${PG_USER:-cdcim}:${PG_PASSWORD}@cdcim-pg:5432/${PG_DB:-cdcim}
      TD_ENDPOINT: cdcim-tsdb:6041
      TD_USER: ${TDENGINE_USER:-root}
      TD_PASSWORD: ${TDENGINE_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cdcim-cache:6379/0
      KAFKA_BOOTSTRAP: cdcim-broker:9092
      PG_POOL_SIZE: ${PG_POOL_SIZE:-20}
      QUERY_CACHE_TTL_S: ${QUERY_CACHE_TTL_S:-60}
      JWT_TTL_S: ${JWT_TTL_S:-1800}
      CDCIM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CDCIM_PG_HOST: cdcim-pg
      CDCIM_PG_PORT: 5432
      CDCIM_PG_DATABASE: ${PG_DB:-cdcim}
      CDCIM_PG_USER: ${PG_USER:-cdcim}
      CDCIM_PG_PASSWORD: ${PG_PASSWORD}
      CDCIM_TDENGINE_HOST: cdcim-tsdb
      CDCIM_TDENGINE_REST_PORT: 6041
      CDCIM_TDENGINE_USER: ${TDENGINE_USER:-root}
      CDCIM_TDENGINE_PASSWORD: ${TDENGINE_PASSWORD}
      CDCIM_REDIS_URL: redis://:${REDIS_PASSWORD}@cdcim-cache:6379/0
      CDCIM_AUTH_MODE: placeholder
    depends_on:
      pg:
        condition: service_healthy
      tsdb:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
    logging: *default-logging

  # ==========================================================
  # 12. 反向代理（唯一对外端口；只挂 core-net，禁止直连数据区）
  # ==========================================================
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: cdcim-nginx
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.3
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 96M
    networks:
      - core-net
    ports:
      # 唯一绑 0.0.0.0 的端口：Windows 浏览器访问 localhost:${PORT_WEB}（C-07）
      - "0.0.0.0:${PORT_WEB:-8080}:80"
    volumes:
      - nginx-cache:/var/cache/nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      API_UPSTREAM: cdcim-api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      # 静态站点与反代配置（nginx.conf）由 P4 构建产出，本批只校验 80 端口可服务
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/"]
    logging: *default-logging

  # ==========================================================
  # 13. 指标（观测面例外：同时接三段网络，只读）
  # ==========================================================
  prometheus:
    image: ${PROM_IMAGE:-prom/prometheus:v2.54.1}
    container_name: cdcim-prom
    restart: unless-stopped
    mem_limit: 224m
    cpus: 0.3
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 224M
    networks:
      - edge-net
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_PROM:-9090}:9090"
    volumes:
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
    logging: *default-logging

  # ==========================================================
  # 14. 看板（只挂 core-net，只访问 Prometheus）
  # ==========================================================
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.2}
    container_name: cdcim-grafana
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 192M
    networks:
      - core-net
    ports:
      - "127.0.0.1:${PORT_GRAFANA:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${PORT_GRAFANA:-3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health"]
    logging: *default-logging

  # ==========================================================
  # 15.（可选）Flink 作业管理器 —— profile=flink
  #     替代实现，不进物理视图的 14 单元，也不进 4 702 MB 预算；
  #     内存取自 4.3 GB 余量（部署说明 §5 已记账）
  # ==========================================================
  flink:
    image: ${FLINK_IMAGE:-flink:1.19.1-scala_2.12-java17}
    container_name: cdcim-flink
    profiles: ["flink"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - core-net
      - data-net
    ports:
      - "127.0.0.1:${PORT_FLINK:-8081}:8081"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: cdcim-flink
        jobmanager.memory.process.size: 448m
        taskmanager.memory.process.size: 448m
        parallelism.default: 1
        state.backend: hashmap
    depends_on:
      broker:
        condition: service_healthy
      tsdb:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8081'"]
    logging: *default-logging

# ============================================================
# 命名卷（13 个，对应物理视图 TAB-ARCH-123 的 13 卷）
# Compose 会自动加项目前缀，实际卷名为 cdcim_<key>；
# 与物理视图文档名的对照见部署说明 §4。
# ============================================================
volumes:
  # 不可重建（原始数据唯一副本）
  tdengine-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_tdengine-data
  pg-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_pg-data
  collector-queue:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_collector-queue
  # 半可重建 / 可重建
  redpanda-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_redpanda-data
  dlq:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_dlq
  mqtt-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_mqtt-data
  qdrant-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_qdrant-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_redis-data
  prom-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_prom-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_grafana-data
  nginx-cache:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_nginx-cache
  # 备份与归档卷：由宿主侧备份脚本挂载（P6 交付），默认无容器占用，故不会被创建
  backup:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_backup
  archive:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}_archive

# ============================================================
# 三段 bridge 网络（物理视图 §4）
# 划分依据是信任级别 + 访问方向，不是分层；
# 「不接该网络」即物理不通——这是断网实验与四条拒绝连线的实现手段。
# ============================================================
networks:
  edge-net:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}-edge-net
    driver: bridge
  core-net:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}-core-net
    driver: bridge
  data-net:
    name: ${COMPOSE_PROJECT_NAME:-cdcim}-data-net
    driver: bridge
